name: Majora's Mask Watch

on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes (GitHub's minimum; runs can start a few minutes late)
       workflow_dispatch:
       inputs:
         test_alarm: {description: "Fire a TEST alarm", type: boolean, default: false}
permissions:
  contents: write

concurrency:
  group: majora-watch
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check Nintendo for Majora's Mask
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NTFY_REPEATS: ${{ secrets.NTFY_REPEATS }}
          ALARM_EMAIL: ${{ secrets.ALARM_EMAIL }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          TEST_ALARM: ${{ inputs.test_alarm && '1' || '0' }}
        run: python majora_watch.py

      - name: Save state
        run: |
          if [[ -n "$(git status --porcelain state.json)" ]]; then
            git config user.name "majora-bot"
            git config user.email "majora-bot@users.noreply.github.com"
            git add state.json
            git commit -m "Update watch state"
            git push
          fi
